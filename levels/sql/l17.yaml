id: sql-l17
track: sql
index: 17
title: Sub consultas y sello
subtitle: SELECT con IN (SELECT …)
xp: 95
difficulty: 4
brief: "La misión «fallo» embarca un agente: la marca viaja en su SELLO. La subconsulta con IN
  filtra en dos pasos sin JOIN explícito."
goal: De agentess, imprime el SELLO (con la marca) de los agentes que TENGAN misión con tarea fallo
  (IN con SELECT interno).
setup: >
  #!/bin/bash

  set -e

  sqlite3 /home/agent/dojo.sqlite "

  CREATE TABLE agentess (id INTEGER PRIMARY KEY, nombre TEXT, sello TEXT);

  CREATE TABLE misiones (id INTEGER PRIMARY KEY, agente_id INT, tarea TEXT);

  INSERT INTO agentess VALUES (1,'xarevena','plata'),(2,'kira','$DOJO_FLAG'),(3,'miki','bronce');

  INSERT INTO misiones VALUES (1,2,'fallo'),(2,1,'reparto'),(3,3,'ronda');" && chmod 644
  /home/agent/dojo.sqlite && chown agent:agent /home/agent/dojo.sqlite
solution: sqlite3 /home/agent/dojo.sqlite "SELECT sello FROM agentess WHERE id IN (SELECT agente_id
  FROM misiones WHERE tarea='fallo');"
hints:
  - "Subquery: SELECT con IN (SELECT agente_id FROM misiones WHERE …)."
  - La tarea fallo pertenece al agente_id 2 — su sello es ORO.
  - 'Una línea: sqlite3 db "SELECT …" imprime la cadena.'
teach: "IN (SELECT …) filtra con la lista de otra consulta: cuando buscas UNA familia (los agentes
  de la misión fallo), a veces un IN es MÁS claro que el JOIN explícito. Escalar (= (SELECT…)) trae
  1 fila; IN trae MUCHAS."
cheatsheet:
  - cmd: WHERE id IN (SELECT id FROM t)
    desc: subconsulta con IN
  - cmd: WHERE id = (SELECT magic)
    desc: "escalar: solo una fila"
keywords:
  - sql
  - subconsulta
  - in
  - select
profile: default
examples:
  - title: salida esperada (flag demo)
    content: FLAG{d3b09a4f7c2e1b8d6041a5f3}
