id: procesos-l5
track: procesos
title: Unidades de ficción
subtitle: systemctl simulado (status, list-units)
xp: 60
difficulty: 3
brief: >
  En este dojo no corre systemd: corremos un clon minimalista. Un agente puso la
  clave en la unit 'forge.service' y dejó un systemctl simulado que lista units
  y sus ficheros de definición.
goal: >
  Usa el systemctl simulado para LISTAR las unidades del dojo (list-units o
  --list-units), encuentra cuál lleva la FLAG en su descripción (Description=…)
  y muestrala leyendo el fichero de la unit correspondiente.
setup: |
  #!/bin/bash
  set -e
  arena-prompt "LVL 05" "Procesos"
  mkdir -p /etc/systemd/system
  cat > /etc/systemd/system/forge.service <<EOF
  [Unit]
  Description=forge that stores the code: $DOJO_FLAG
  [Service]
  ExecStart=/bin/true
  EOF
  for u in web.service cache.service; do
    cat > "/etc/systemd/system/$u" <<EOF
  [Unit]
  Description=${u%.service} simulada del dojo
  [Service]
  ExecStart=/bin/true
  EOF
  done
  cat > /usr/local/bin/systemctl <<'SCTL'
  #!/bin/bash
  # systemctl simulado del dojo (no es systemd real)
  case "${1:-}" in
    list-units|--list-units)
      for f in /etc/systemd/system/*; do
        [ -f "$f" ] || continue
        desc=$(grep '^Description=' "$f" | head -1)
        printf '%-28s %s\n' "$(basename "$f")" "${desc#Description=}"
      done
      ;;
    status)
      f="/etc/systemd/system/${2:-}"
      [ -f "$f" ] && cat "$f" || { echo "unit no existe: $2"; exit 1; }
      ;;
    *) echo "uso: systemctl list-units | status <unit>"; exit 2;;
  esac
  SCTL
  chmod 0755 /usr/local/bin/systemctl
hints:
  - systemctl list-units  |  systemctl --list-units
  - "lee la unit interessante: cat /etc/systemd/system/forge.service"
teach: >
  El systemctl real gestiona systemd units (servicios del sistema); el dojo lo
  SIMULA para que practiques la mecánica. `systemctl status unidad` te dice cómo
  está y qué fichero la define; el fichero .service guarda metadatos
  (Description=) y qué ejecutar (ExecStart=).
cheatsheet:
  - cmd: systemctl list-units
    desc: lista servicios (simulado)
  - cmd: systemctl status forge.service
    desc: cómo está una unit
solution: |
  systemctl list-units
  cat /etc/systemd/system/forge.service
keywords:
  - systemctl
  - unidades
profile: default
examples:
  - title: salida esperada (flag demo)
    content: >-
      cache.service                cache simulada del dojo

      forge.service                forge that stores the code:
      FLAG{d3b09a4f7c2e1b8d6041a5f3}

      web.service                  web simulada del dojo

      [Unit]

      Description=forge that stores the code: FLAG{d3b09a4f7c2e1b8d6041a5f3}

      [Service]

      ExecStart=/bin/true
