id: awk-pro-l6
track: awk-pro
index: 6
title: Ventana de líneas
subtitle: awk con doble condición en NR
xp: 65
difficulty: 4
brief: El fichero escenas.log guarda la sección crítica entre las líneas 4 y 6 (inclusiva).
goal: De escenas.log, imprime SOLAMENTE las líneas 4 a 6 (INCLUIDAS).
setup: >
  #!/bin/bash

  set -e

  arena-prompt "LVL 06" "Awk-Pro"

  { for i in $(seq 1 10); do
      if [ "$i" -eq 5 ]; then echo "línea-5: el dato $DOJO_FLAG"; else echo "línea $i: humo"; fi
    done; } > /home/agent/escenas.log
  chown agent:agent /home/agent/escenas.log
solution: awk 'NR >= 4 && NR <= 6' /home/agent/escenas.log
hints:
  - DOBLE condición con el operador && sobre NR.
  - NR es 1-based.
  - awk 'NR >= 4 && NR <= 6' /home/agent/escenas.log
teach: Con la doble condición en NR puedes reproducir el «sed -n 4,6p» con awk. Nota que
  el RANGO INCLUIVE ambos extremos (>= y <=).
cheatsheet:
  - cmd: awk 'NR >= 4 && NR <= 6' f
    desc: líneas 4 a 6
  - cmd: awk 'NR % 2 == 0' f
    desc: solo las líneas pares
keywords:
  - awk
  - NR
  - rango
profile: default
