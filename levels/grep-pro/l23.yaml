id: grep-pro-l23
track: grep-pro
index: 23
title: ISO extraction
subtitle: grep -oE de fechas AAAA-MM-DD
xp: 75
difficulty: 5
brief: El log guarda las fechas en varias formas (ISO y texto) y en distintas
  posiciones.
goal: De tiempos.log extrae SOLAMENTE las fechas AAAA-MM-DD (una por línea) y
  deja a la vista la línea del testigo con la marca.
setup: |
  #!/bin/bash
  set -e
  arena-prompt "LVL 23" "Grep-Pro"
  cat > /home/agent/tiempos.log <<EOF
  el ejercicio comenzó el 2022-04-15 a medio día
  la marca fue el 2019-02-01 (término debió)
  $DOJO_FLAG
  por la falta 2023-04 incompleta invalida
  con hora también ok: 2024-11-20T13:45:02
  EOF
  chown agent:agent /home/agent/tiempos.log
solution: grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' /home/agent/tiempos.log ; grep
  'FLAG{' /home/agent/tiempos.log
hints:
  - "{n} pide n dígitos consecutivos; con -oE cada fecha sale limpia en su
    línea."
  - La línea del testigo con la marca sale aparte con grep.
  - grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' /home/agent/tiempos.log ; grep 'FLAG{'
    /home/agent/tiempos.log
teach: El patrón [0-9]{4}-[0-9]{2}-[0-9]{2} extrae las fechas ISO. La gracia -o
  + {n} es reemplazar el «recortar con cut/awk» por directamente un regex
  experto.
cheatsheet:
  - cmd: grep -oE '[0-9]{4}-[0-9]{2}' f
    desc: AAAA-MM
  - cmd: grep -oE '[0-9]{2}:[0-9]{2}' f
    desc: hh:mm
keywords:
  - grep
  - -oE
  - fechas
profile: default
examples:
  - title: salida esperada (flag demo)
    content: |-
      2022-04-15
      2019-02-01
      2024-11-20
      FLAG{d3b09a4f7c2e1b8d6041a5f3}
