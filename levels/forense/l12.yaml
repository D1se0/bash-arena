id: forense-l12
track: forense
index: 12
title: Señuelos y la marca pura
subtitle: regex que discrimina falsos vestigios
xp: 55
difficulty: 4
brief: "rastro.txt está sembrado de FAKE {FLAG{decoy-XX}} para no permitir los
  filtros: la marca REAL es la única de 24 caracteres hexadecimales MAYUSCULASNO
  dentro."
goal: Extrae de /home/agent/rastro.txt únicamente la marca real (24 hex
  lowercase) descartando los señuelos.
setup: >-
  #!/bin/bash

  set -e

  arena-prompt "LVL 12" "Forense"

  i=1

  while [ $i -le 14 ]; do echo "señuelo $i FLAG{decoy-$i}" >>
  /home/agent/rastro.txt; i=$((i+1)); done

  echo "registro limpio: $DOJO_FLAG" >> /home/agent/rastro.txt

  i=15

  while [ $i -le 28 ]; do echo "señuelo $i FLAG{decoy-$i}" >>
  /home/agent/rastro.txt; i=$((i+1)); done

  chown agent:agent /home/agent/rastro.txt
solution: grep -oE 'FLAG\{[0-9a-f]{24}\}' /home/agent/rastro.txt
hints:
  - "Los señuelos llevan letras y guiones: la clase [0-9a-f] NO casa guiones."
  - El cuantificador {24} exige EXACTAMENTE 24 caracteres.
  - grep -oE 'FLAG\{[0-9a-f]{24}\}' rastro.txt
teach: "Las regex con clases y cuantificadores EXACTOS ({24}, [0-9a-f]) son cómo
  se descarta la basura: el patrón codifica la estructura REAL de lo legítimo.
  Arma afilada contra los señuelos."
cheatsheet:
  - cmd: grep -oE 'p\{24\}' f
    desc: cuantificador exacto
  - cmd: grep -c 'decoy' f
    desc: cuenta los señuelos
keywords:
  - regex
  - decoy
  - cuantificador
profile: default
examples:
  - title: salida esperada (flag demo)
    content: FLAG{d3b09a4f7c2e1b8d6041a5f3}
