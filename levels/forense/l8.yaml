id: forense-l8
track: forense
index: 8
title: Volcado hexadecimal
subtitle: "xxd -r: reconstruir del hex"
xp: 45
difficulty: 3
brief: volcado.hex proviene de un volcado xxd del fichero original. Los bytes están ahí, solo hay
  que re-ensamblar.
goal: Reconstruye /home/agent/volcado.hex con xxd -r y muestra el texto original (que contiene la marca).
setup: |-
  #!/bin/bash
  set -e
  arena-prompt "LVL 08" "Forense"
  echo "volcado real de la sala: $DOJO_FLAG" > /tmp/reveal.txt
  xxd /tmp/reveal.txt > /home/agent/volcado.hex
  rm -f /tmp/reveal.txt
  chown agent:agent /home/agent/volcado.hex
solution: xxd -r /home/agent/volcado.hex
hints:
  - xxd muestra bytes en hex; la opción -r hace la máscara inversa.
  - "La salida vuelve al stdout: puedes encadenerla con grep."
  - xxd -r volcado.hex
teach: "xxd -r revierte un volcado hex a bytes: la forensic reconstrucción de ficheros que ya no
  existen. Grabar claves hexa es exactamente lo mismo que las marcas hexa frecuentes en el foro."
cheatsheet:
  - cmd: xxd -r f.hex
    desc: hex → bytes
  - cmd: xxd f
    desc: bytes → hex
keywords:
  - xxd
  - hex
  - reversa
profile: default
