id: grep-l4
track: grep
index: 4
title: La línea número…
subtitle: "grep -n: numerar resultados"
xp: 35
difficulty: 2
brief: Para reportar el incidente al rango superior necesitas saber en QUÉ línea
  del registro aterrizó la anomalía.
goal: "Imprime la línea de la anomalía con su número de línea (formato nº:
  contenido)."
setup: |
  #!/bin/bash
  set -e
  arena-prompt "LVL 04" "Grep"
  { for i in $(seq 1 15); do
      case $i in
        12) echo "2026-10-22 08:$i anomalía $DOJO_FLAG";;
        4) echo "2026-10-22 08:0$i revisión rutinaria";;
        *) echo "2026-10-22 08:$i turno sin novedades";;
      esac;
    done; } > /home/agent/turnos.log
  chown agent:agent /home/agent/turnos.log
solution: grep -n 'anomalía' /home/agent/turnos.log
hints:
  - −n antepone el número de línea a cada coincidencia.
  - La palabra anomalía (con acento) aparece solo en la línea 12.
  - grep -n 'anomalía' /home/agent/turnos.log
teach: "grep -n numeriza las coincidencias: imprescindible para decir «línea 12»
  al operador de guardia. Se combina con las demás opciones: -in, -rn, -on…"
cheatsheet:
  - cmd: grep -n patrón f
    desc: con número de línea
  - cmd: grep -in patrón f
    desc: insensible + numerado
keywords:
  - grep
  - -n
  - numerar
profile: default
examples:
  - title: salida esperada (flag demo)
    content: 12:2026-10-22 08:12 anomalía FLAG{d3b09a4f7c2e1b8d6041a5f3}
