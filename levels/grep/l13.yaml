id: grep-l13
track: grep
index: 13
title: La línea exacta
subtitle: "grep -x: coincidencia de línea completa"
xp: 75
difficulty: 4
brief: "El registro de accesos guarda pares sec=valor con trampas: indentados,
  con cola, comentados… Solo una línea es limpia de la forma sec=valor_entero."
goal: Imprime del registro únicamente las líneas que son exactamente sec=valor
  (sin espacios antes o después del valor).
setup: |
  #!/bin/bash
  set -e
  arena-prompt "LVL 13" "Grep"
  cat > /home/agent/accesos.txt <<EOF
  sec=$DOJO_FLAG
    sec=eco con indentación
  sec=coeco con cola ash
  # sec=comentario del auditor
  clave sec=eco en el medio
  sec=	eco tras tabulador
  sec=
  EOF
  chown agent:agent /home/agent/accesos.txt
solution: grep -xE 'sec=[^[:space:]]+' /home/agent/accesos.txt
hints:
  - −x exige que el patrón case TODA la línea (equivale a ^patrón$).
  - "[^[:space:]]+ es «uno o más símbolos que no sean espacios»: descarta
    indentados, colas y tabs."
  - grep -xE 'sec=[^[:space:]]+' /home/agent/accesos.txt
teach: grep -x (exact) obliga a que la coincidencia cubra la línea entera. Con
  la clase negada [^[:space:]] eliminan trampas de espacios; combinado -xE
  demuestra que las opciones se acumulan.
cheatsheet:
  - cmd: grep -x 'palabra' f
    desc: coincidencia de línea entera
  - cmd: grep -xE 'sec=[^[:space:]]+'
    desc: exacto con clase negada
keywords:
  - grep
  - -x
  - exacto
profile: default
examples:
  - title: salida esperada (flag demo)
    content: sec=FLAG{d3b09a4f7c2e1b8d6041a5f3}
