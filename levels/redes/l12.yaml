id: redes-l12
track: redes
index: 12
title: Auditoría de escucha
subtitle: ss + json + curl a medida
xp: 55
difficulty: 4
brief: "Un API en 7700 solo responde con la cabecera correcta: Accept: application/arena-json. Ojo
  también al puerto, que puede caminar."
goal: "Consulta http://127.0.0.1:7700/api con la cabecera Accept: application/arena-json y muéstrala
  (el puerto correcto lo delata ss)."
setup: |-
  #!/bin/bash
  set -e
  arena-prompt "LVL 12" "Redes"

  mkdir -p /etc/arena

  cat > /etc/arena/api7.py <<FIN
  from http.server import BaseHTTPRequestHandler, HTTPServer
  class H(BaseHTTPRequestHandler):
      def do_GET(self):
          if self.headers.get("Accept", "") == "application/arena-json":
              self.send_response(200)
              self.end_headers()
              self.wfile.write(("secreto del api: " + "__BANDERA__" + "\n").encode())
          else:
              self.send_response(406)
              self.end_headers()
              self.wfile.write(b"accept header no aceptable\n")
      def log_message(self, *a):
          pass
  HTTPServer(("127.0.0.1", 7700), H).serve_forever()
  FIN
  sed -i "s/__BANDERA__/$DOJO_FLAG/" /etc/arena/api7.py
  nohup python3 /etc/arena/api7.py >/dev/null 2>&1 &
  sleep 2
  chown -R agent:agent /home/agent
solution: "curl -s -H 'Accept: application/arena-json' http://127.0.0.1:7700/api"
hints:
  - ss -tln te confirma que el puerto escucha.
  - 'La cabecera se manda con curl -H "Accept: application/arena-json" (el GET 406 se arregla
    exactamente así).'
  - "curl -s -H 'Accept: application/arena-json' http://127.0.0.1:7700/api"
teach: "Las cabeceras de PETICIÓN son la mitad de la conversación HTTP: Accept, Authorization,
  Content-Type… curl -H las teclea por ti. Los errores 406 normalmente delatan una cabecera
  ausente."
cheatsheet:
  - cmd: 'curl -H "X: y" URL'
    desc: mandar cabecera a medida
  - cmd: ss -tlnp
    desc: mapa de escucha
keywords:
  - ss
  - curl -H
  - accept
  - api
profile: default
