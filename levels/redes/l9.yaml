id: redes-l9
track: redes
index: 9
title: La cabecera reveladora
subtitle: "curl -i: ver también los headers"
xp: 40
difficulty: 3
brief: El auditor añadió una cabecera HTTP personalizada con la clave; el cuerpo
  de la respuesta esta limpio.
goal: Descarga http://127.0.0.1:7080/auditoria mostrando TAMBIÉN las cabeceras y
  localiza la cabecera X-Arena-Flag.
setup: |-
  #!/bin/bash
  set -e
  arena-prompt "LVL 09" "Redes"

  mkdir -p /etc/arena

  cat > /etc/arena/auditServer.py <<FIN
  from http.server import BaseHTTPRequestHandler, HTTPServer
  class H(BaseHTTPRequestHandler):
      def do_GET(self):
          self.send_response(200)
          self.send_header("X-Arena-Flag", "__BANDERA__")
          self.send_header("Content-Type", "text/plain")
          self.end_headers()
          self.wfile.write(b"auditoria ejecutada: todo limpio\n")
      def log_message(self, *a):
          pass
  HTTPServer(("127.0.0.1", 7080), H).serve_forever()
  FIN
  sed -i "s/__BANDERA__/$DOJO_FLAG/" /etc/arena/auditServer.py
  nohup python3 /etc/arena/auditServer.py >/dev/null 2>&1 &
  sleep 2
  chown -R agent:agent /home/agent
solution: curl -s -i http://127.0.0.1:7080/auditoria
hints:
  - "La cabecera NO aparece en el cuerpo: hay que ver la respuesta cruda."
  - curl -i (o -I) imprime también los headers.
  - curl -s -i http://127.0.0.1:7080/auditoria
teach: "Los headers HTTP son metadata donde se esconde casi todo (rate-limits,
  versiones, tokens de sesión): curl -i los destapa junto al cuerpo. Curl -I
  solo los cabecera."
cheatsheet:
  - cmd: curl -i URL
    desc: cuerpo + cabeceras
  - cmd: curl -s -D - URL
    desc: cabeceras a disco/stdout
keywords:
  - curl
  - headers
  - cabecera
profile: default
examples:
  - title: salida esperada (flag demo)
    content: "HTTP/1.0 200 OK\r

      Server: BaseHTTP/0.6 Python/3.12.3\r

      Date: Fri, 23 Oct 2026 11:37:17 GMT\r

      X-Arena-Flag: FLAG{d3b09a4f7c2e1b8d6041a5f3}\r

      Content-Type: text/plain\r

      \r

      auditoria ejecutada: todo limpio"
