id: procesado-l23
track: procesado
index: 23
title: El mínimo invisible
subtitle: awk min con NR==1
xp: 30
difficulty: 2
brief: "La lista de latencias ms: el evento más RAPIDO ήταν anomalía y lleva la marca."
goal: De latencias.txt imprime SOLO la fila con el valor mínimo (de la 2.ª columna) sin
  cambiar la línea original.
setup: |-
  #!/bin/bash
  set -e
  arena-prompt "LVL 23" "Procesado"
  cat > /home/agent/latencias.txt <<EOF
  srv-a 120
  srv-b 40
  srv-c 260
  srv-d 15 $DOJO_FLAG
  EOF
  chown agent:agent /home/agent/latencias.txt
solution: awk 'NR==1 || $2 < m {m=$2; l=$0} END {print l}' /home/agent/latencias.txt
hints:
  - Guarda el MINIMO en m; la línea ORIGINAL en l (así la fila entera sale al final).
  - NR==1 inicializa el primer valor como mínimo (correcto para la primera fila).
  - awk 'NR==1 || $2 < m {m=$2; l=$0} END {print l}' latencias.txt
teach: "Los patrones awk de min/max guardan AMBAS piezas: el valor para comparar y la
  línea para imprimir en END. Sin sort, sin head: una sola pasada."
cheatsheet:
  - cmd: awk 'NR==1||$2<m{m=$2;l=$0}END{print l}' f
    desc: línea con el valor mínimo
  - cmd: awk 'NR==1||$2>m{m=$2;l=$0}END{print l}' f
    desc: ídem con el máximo
keywords:
  - awk
  - min
  - END
  - una pasada
profile: default
examples:
  - title: salida esperada (flag demo)
    content: FLAG{round5-demo}
