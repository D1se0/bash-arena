id: fundamentos-l18
track: fundamentos
index: 18
title: Historia reciente
subtitle: bash_history como pista forense
xp: 40
difficulty: 3
brief: "Alguien dejó su .bash_history sin limpiar: entre comandos rutinarios quedó impresa la ruta
  del fichero con la pieza."
goal: Encuentra en /home/agent/.bash_history la única ruta bajo /var que aparece y muestra ese fichero.
setup: >-
  #!/bin/bash

  set -e

  arena-prompt "LVL 18" "Fundamentos"

  mkdir -p /var/local/notas

  rm -f /home/agent/.bash_history

  printf 'ls /home/agent\nexport TERM=xterm-256color\ncat /var/local/notas/salida.txt\ncd /tmp\n' >
  /home/agent/.bash_history

  echo "$DOJO_FLAG" > /var/local/notas/salida.txt

  chmod 644 /var/local/notas/salida.txt /home/agent/.bash_history

  chown agent:agent /home/agent/.bash_history

  chown -R agent:agent /home/agent
solution: p=$(grep -oE '/var/[a-z/.]+' /home/agent/.bash_history | sort -u | head -n1); cat "$p"
hints:
  - history y cat ~/.bash_history muestran lo mismo; el fichero es lo greppable.
  - grep -oE con regex de ruta deja solo la ruta; sort -u la desduplica.
  - p=$(grep -oE '/var/[a-z/.]+' ~/.bash_history); cat "$p"
teach: ".bash_history es oro forense: comandos, rutas y hasta errores revelan lo que pasó. grep -oE
  sobre history es una receta de incident response de verdad."
cheatsheet:
  - cmd: history
    desc: comandos de la sesión
  - cmd: grep -oE 'patrón' ~/.bash_history
    desc: extraer datos del history
keywords:
  - history
  - grep
  - forense
profile: default
