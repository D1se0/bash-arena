id: fundamentos-l15
track: fundamentos
index: 15
title: Variable heredada
subtitle: source y variables de entorno
xp: 35
difficulty: 2
brief: Un fichero de entorno guarda la ruta de la bóveda en la variable
  DOJO_PATH. Cárgalo en tu shell y usa la variable.
goal: Carga /home/agent/.login_env y usa $DOJO_PATH para mostrar el contenido de
  la bóveda.
setup: |-
  #!/bin/bash
  set -e
  arena-prompt "LVL 15" "Fundamentos"
  mkdir -p /etc/arena /home/agent/boveda
  echo "export DOJO_PATH=/home/agent/boveda/clave.txt" > /home/agent/.login_env
  echo "clave de la bóveda: $DOJO_FLAG" > /home/agent/boveda/clave.txt
  chmod 644 /home/agent/.login_env /home/agent/boveda/clave.txt
  chown -R agent:agent /home/agent
solution: source /home/agent/.login_env; cat "$DOJO_PATH"
hints:
  - "source (o el punto .) ejecuta un fichero en TU shell actual: las variables
    quedan cargadas."
  - 'Después, la ruta vive en $DOJO_PATH: cat "$DOJO_PATH".'
  - source /home/agent/.login_env; cat "$DOJO_PATH"
teach: 'source NO abre un subshell: las variables quedan en tu sesión. Es la
  diferencia entre "ejecutar" (fork: variables efímeras) y "cargar" (dot).
  Clásico de .bashrc y .env.'
cheatsheet:
  - cmd: source f
    desc: carga variables en el shell
  - cmd: . f
    desc: equivalente corto
keywords:
  - source
  - env
  - variables
profile: default
examples:
  - title: salida esperada (flag demo)
    content: "clave de la bóveda: FLAG{d3b09a4f7c2e1b8d6041a5f3}"
