id: filtrado-l6
track: filtrado
index: 6
title: La cola de la bitácora
subtitle: tail -n +N y recortes con head
xp: 35
difficulty: 2
brief: "La bitácora acumula cientos de líneas de latidos. El incidente quedó
  anotado en la cola: desde la línea 360."
goal: Imprime las 20 primeras líneas a partir del renglón 360 de
  /home/agent/bitacora.log.
setup: >-
  #!/bin/bash

  set -e

  arena-prompt "LVL 06" "Filtrado"

  i=1

  while [ $i -le 359 ]; do echo "linea $i latido rutinario del sistema";
  i=$((i+1)); done > /home/agent/bitacora.log

  echo "linea 360 anomalia detectada: $DOJO_FLAG" >> /home/agent/bitacora.log

  i=365

  while [ $i -le 400 ]; do echo "linea $i latido"; i=$((i+1)); done >>
  /home/agent/bitacora.log

  chown agent:agent /home/agent/bitacora.log
solution: tail -n +360 /home/agent/bitacora.log | head -n 20
hints:
  - tail -n +360 incluye la línea 360 como primera de la salida.
  - Encadena con head -n 20 para recortar la ventana.
  - tail -n +360 bitacora.log | head -n 20
teach: tail -n +N lee DESDE la línea N hasta el final; head -n M corta. La
  combinación «desde + recorte» es el patrón estándar para inspeccionar tramos
  de logs enormes.
cheatsheet:
  - cmd: tail -n +N f
    desc: desde la línea N al final
  - cmd: tail -n 20 f
    desc: últimas 20 líneas
keywords:
  - tail
  - head
  - ventana
  - logs
profile: default
examples:
