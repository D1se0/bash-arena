id: filtrado-l16
track: filtrado
index: 16
title: El eco repetido
subtitle: "uniq -d: solo las repetidas"
xp: 40
difficulty: 3
brief: visitas.log registra líneas sueltas. Una sola línea aparece repetida (dos veces) y esa
  esconde la pieza; todas las demás son únicas.
goal: Extrae la ÚNICA línea repetida de /home/agent/visitas.log.
setup: |-
  #!/bin/bash
  set -e
  arena-prompt "LVL 16" "Filtrado"
  {
  echo "GET /inicio"
  echo "GET /mapa"
  echo "marca $DOJO_FLAG"
  echo "marca $DOJO_FLAG"
  echo "GET /contacto"
  echo "GET /torneo"
  echo "GET /docs"
  echo "GET /salida"
  } > /home/agent/visitas.log
  chown agent:agent /home/agent/visitas.log
  chown -R agent:agent /home/agent
solution: sort /home/agent/visitas.log | uniq -d
hints:
  - "uniq solo compara LÍNEAS ADYACENTES: primero sort, después uniq."
  - uniq -d muestra únicamente las líneas que aparecen más de una vez.
  - sort /home/agent/visitas.log | uniq -d
teach: "uniq exige adyacencia: sort | uniq es la pareja inseparable. -d (duplicadas), -u (únicas) y
  -c (contar) cubren el 90 % de los análisis de logs rápidos."
cheatsheet:
  - cmd: sort f | uniq -d
    desc: líneas repetidas
  - cmd: sort f | uniq -c
    desc: cuenta de cada línea
keywords:
  - uniq
  - sort
  - duplicados
profile: default
