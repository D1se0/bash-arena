id: filtrado-l9
track: filtrado
index: 9
title: El visitante solitario
subtitle: "uniq -c: contar repetidos"
xp: 40
difficulty: 3
brief: "Un usuario accedió solo UNA vez al sistema: los demás repiten decenas de veces. El solitario
  dejó su marca."
goal: Encuentra la línea que aparece exactamente una vez en /home/agent/accesos.txt (tras quitar
  repetidos) y muéstrala.
setup: >-
  #!/bin/bash

  set -e

  arena-prompt "LVL 09" "Filtrado"

  i=1

  while [ $i -le 31 ]; do echo "nova"; echo "fang"; echo "kali"; i=$((i+1)); done >
  /home/agent/accesos.txt

  echo "firma única: $DOJO_FLAG" >> /home/agent/accesos.txt

  chown agent:agent /home/agent/accesos.txt
solution: sort /home/agent/accesos.txt | uniq -c | grep ' 1 '
hints:
  - "uniq solo agrupa repetidos CONSECUTIVOS: antes pásalo por sort."
  - uniq -c antepone el contador a cada línea.
  - sort accesos.txt | uniq -c | grep " 1 "
teach: "El tándem sort | uniq -c es la herramienta de frecuencias: cuenta cuántas veces aparece cada
  valor. El contador ocupa la primera columna: úsalo para filtrar."
cheatsheet:
  - cmd: sort f | uniq -c
    desc: cuenta repeticiones
  - cmd: uniq -c | grep ' 1 '
    desc: solo únicos
keywords:
  - uniq
  - sort
  - frecuencia
profile: default
