id: permisos-l17
track: permisos
index: 17
title: La pila congelada
subtitle: "find -perm 000: ficheros muertos"
xp: 45
difficulty: 3
brief: En ~/redactar todos los ficheros menos uno tienen por cerrado (000). Dáles lectura a los
  muertos y extrae la pieza del que hasta ahora estaba blanco.
goal: Encuentra en /home/agent/redactar el fichero con permisos 000, restáura su lectura para el
  dueño y muéstralo.
setup: >-
  #!/bin/bash

  set -e

  arena-prompt "LVL 17" "Permisos"

  mkdir -p /home/agent/redactar

  for i in 1 2 3 4 5; do echo "acta $i: normal" > /home/agent/redactar/a$i.txt; chmod 600
  /home/agent/redactar/a$i.txt; done

  echo "acta 6: $DOJO_FLAG" > /home/agent/redactar/a6.txt

  chmod 000 /home/agent/redactar/a6.txt

  chown -R agent:agent /home/agent
solution: f=$(find /home/agent/redactar -perm 000 -type f); chmod 600 "$f"; cat "$f"
hints:
  - find -perm 000 encuentra exactamente los ficheros sin ningún permiso.
  - chmod 600 los deja r+w para el dueño (o 644).
  - f=$(find d -perm 000); chmod 600 "$f"; cat "$f"
teach: Un 000 es un fichero invisible para el contenido y visible por nombre. find -perm 000 es su
  buscador idóneo — igual que -perm 400 desenmáscara esos "solo lectura" que confunden.
cheatsheet:
  - cmd: find d -perm 000
    desc: ficheros soldados
  - cmd: chmod 600 f
    desc: dueño r+w
keywords:
  - perm
  - "000"
  - chmod
profile: default
