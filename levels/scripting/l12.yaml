id: scripting-l12
track: scripting
index: 12
title: La caja según el estado
subtitle: case + fichero de estado
xp: 50
difficulty: 4
brief: estado.txt indica el MODO activo. caja.sh sabe contestar con la rama
  adecuada… si le pasas el modo correcto como argumento.
goal: Lee /home/agent/estado.txt e invoca /home/agent/caja.sh con ese modo.
  Caja.sh imprimirá la ficha del modo correcto (una de ellas lleva la marca).
setup: |-
  #!/bin/bash
  set -e
  arena-prompt "LVL 12" "Scripting"
  echo "modo-fantasma" > /home/agent/estado.txt
  cat > /home/agent/caja.sh <<FIN
  #!/bin/bash
  case \$1 in
    modo-fantasma) echo "ficha fantasma: $DOJO_FLAG"; ;;
    modo-normal) echo "ficha normal sin nada"; ;;
    modo-guardia) echo "ficha de guardia"; ;;
    *) echo "modo desconocido"; ;;
  esac
  FIN
  chmod 755 /home/agent/caja.sh
  chown -R agent:agent /home/agent
solution: bash /home/agent/caja.sh "$(cat /home/agent/estado.txt)"
hints:
  - "Primero lee el estado: cat estado.txt."
  - Luego invoca caja.sh con ese valor como $1.
  - bash caja.sh "$(cat estado.txt)"
teach: "Combinar $(…) dentro de los argumentos es la forma de pasarle a un
  script dinámicas reales: la salida de un comando (estado) alimenta el
  siguiente (caja). así viven los scripts de un administrador."
cheatsheet:
  - cmd: script "$(cat f)"
    desc: argumento leído de fichero
  - cmd: cat estado.txt
    desc: primero mira el estado
keywords:
  - case
  - estado
  - sustitución
profile: default
examples:
  - title: salida esperada (flag demo)
    content: "ficha fantasma: FLAG{d3b09a4f7c2e1b8d6041a5f3}"
