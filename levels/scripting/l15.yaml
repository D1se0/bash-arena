id: scripting-l15
track: scripting
index: 15
title: La taquilla numérica
subtitle: aritmética $(( ))
xp: 45
difficulty: 3
brief: Dos ficheros de la taquilla, dos números. La SUMA de ambos es el número
  de la celda que guarda la pieza.
goal: Suma el contenido de a.num y b.num de /home/agent/taquilla y muestra la
  celda ~/taquilla/N.txt que sea el resultado.
setup: |-
  #!/bin/bash
  set -e
  arena-prompt "LVL 15" "Scripting"
  mkdir -p /home/agent/taquilla
  echo 39 > /home/agent/taquilla/a.num
  echo 41 > /home/agent/taquilla/b.num
  echo "vacias" > /home/agent/taquilla/78.txt
  echo "celda acertada: $DOJO_FLAG" > /home/agent/taquilla/80.txt
  echo "vacía" > /home/agent/taquilla/84.txt
  chown -R agent:agent /home/agent
solution: a=$(cat /home/agent/taquilla/a.num); b=$(cat
  /home/agent/taquilla/b.num); cat "/home/agent/taquilla/$((a+b)).txt"
hints:
  - $((expr)) hace matemáticas en bash (y no creche chamuscados).
  - La celda correcta se llama con el RESULTADO de la suma.
  - cat "$((a+b))"
teach: "La aritmética de bash es nativa con $(( )): no necesitas expr ni bc para
  enteras (bc sí para decimales). Asignaciones también van dentro: s=$((s+1))."
cheatsheet:
  - cmd: echo $((3*7))
    desc: "21"
  - cmd: s=$((s+1))
    desc: contador
keywords:
  - aritmetica
  - contar
  - bash
profile: default
examples:
  - title: salida esperada (flag demo)
    content: "celda acertada: FLAG{d3b09a4f7c2e1b8d6041a5f3}"
