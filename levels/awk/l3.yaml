id: awk-l3
track: awk
index: 3
title: La contraseña del asistente
subtitle: "awk -F: separador personalizado"
xp: 35
difficulty: 2
brief: El dojo guarda cuentas como passwd, separadas por dos-puntos. La del
  asistente quedó escrita EN CLARO en el segundo campo.
goal: De cuentas.dat, imprime el SEGUNDO campo (la contraseña) de la cuenta cuyo
  primer campo es asistente.
setup: |
  #!/bin/bash
  set -e
  arena-prompt "LVL 03" "Awk"
  cat > /home/agent/cuentas.dat <<EOF
  root:x:0:0:root:/root:/bin/bash
  agente:x:1000:1000::/home/agent:/bin/bash
  asistente:$DOJO_FLAG:1001:1001:asistente:/var/asist:/bin/bash
  invitado:x:1002:1002::/tmp:/bin/sh
  EOF
  chown agent:agent /home/agent/cuentas.dat
solution: "awk -F: '$1 == \"asistente\" {print $2}' /home/agent/cuentas.dat"
hints:
  - "-F: cambia el separador de campos a «dos-puntos»."
  - El filtro $1 == "asistente" es comparación exacta; la acción imprime $2.
  - "awk -F: '$1 == \"asistente\" {print $2}' /home/agent/cuentas.dat"
teach: 'con -F: las líneas passwd se abren en 7 campos: usuario, contraseña,
  uid, gid, GECOS, home, shell. awk también acepta separadores multi-carácter o
  regex: -F"[, ]+".'
cheatsheet:
  - cmd: "awk -F: '{print $1}' f"
    desc: primera columna de passwd
  - cmd: "awk -F: '$3 > 1000' f"
    desc: cuentas con uid alto
keywords:
  - awk
  - -F
  - separador
profile: default
examples:
  - title: salida esperada (flag demo)
    content: FLAG{d3b09a4f7c2e1b8d6041a5f3}
