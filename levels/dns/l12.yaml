id: dns-l12
track: dns
index: 12
title: Boss DNS
subtitle: la cadena completa de DNS
xp: 160
difficulty: 5
brief: El combo ENTRE el reverse-lookup (dig -x), el TXT del nombre (dig +short
  TXT) y la conversión del DOMINIO a la IP (dance getent). La graduación del DNS
  de comandos.
goal: "Paso 1: dig +short -x 10.20.30.44 (el PTR te da el nombre). Paso 2: con
  el NOMBRE recibido: dig +short TXT nombre. La firma del nivel esta en ESE TXT
  del nombre retornado."
setup: >-
  #!/bin/bash

  set -e

  # prelude común de servicios del dojo

  grep -q " $(hostname)" /etc/hosts 2>/dev/null || echo "127.0.0.1 $(hostname)"
  >> /etc/hosts

  mkdir -p /run/sshd /var/dojo 2>/dev/null || true


  true; set +e; pkill -f 'dnsmasq.*53535' 2>/dev/null; set -e

  dnsmasq --port=53535 --no-resolv --bind-interfaces \
    --host-record=dojo-boss,10.20.30.44 \
    --txt-record=dojo-boss,$DOJO_FLAG >/dev/null 2>&1
  sleep 1
solution: nombre=$(dig +short -x 10.20.30.44 @127.0.0.1 -p 53535 | grep -v '^$'
  | head -n 1); dig +short TXT $nombre @127.0.0.1 -p 53535
hints:
  - El PTR está devolviendo dojo-boss. como nombre de la IP 10.20.30.44.
  - El TXT de dojo-boss lleva la FIRMA (la TXT está en la cda de la cual del
    host-record).
  - nombre=$(dig +short -x 10.20.30.44 @127.0.0.1 -p 53535 | grep -v '^$' | head
    -n 1); dig +short TXT $nombre @127.0.0.1 -p 53535
teach: 'El boss final COMBINA: -x (reverso), TXT (la firma) y la cadena de
  comandos $(...). Es el flujo final del "WSI del dominio" que usan los
  sysadmins para rastrear una IP desconocida, con la metadata DNS que la dejamos
  en el TXT.'
cheatsheet:
  - cmd: dig +short -x IP
    desc: "paso 1: el nombre de la IP"
  - cmd: dig +short TXT nombre
    desc: "paso 2: el registro del nombre"
keywords:
  - boss
  - dns
  - dig
  - txT
profile: default
examples:
  - title: salida esperada (flag demo)
    content: '"FLAG{…}"'
