services:
  server:
    build:
      context: ..
      dockerfile: docker/server.Dockerfile
    image: bash-arena/server
    container_name: bash-arena-server
    restart: unless-stopped
    environment:
      - PORT=${PORT:-8080}
      - ARENA_FLAG_SECRET=${ARENA_FLAG_SECRET:-dev-secret-change-me}
      - ARENA_DOCKER_SOCKET=/var/run/docker.sock
    env_file:
      - path: ../.env
        required: false
    ports:
      - "${ARENA_HOST_API_PORT:-127.0.0.1:18080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - arena-data:/data
      - ../levels:/app/levels:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - arena-net

  web:
    build:
      context: ..
      dockerfile: docker/client.Dockerfile
      args:
        VITE_WS_URL: ""
    image: bash-arena/web
    container_name: bash-arena-web
    restart: unless-stopped
    ports:
      - "${ARENA_HOST_WEB_PORT:-8091}:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - arena-net

networks:
  arena-net:
    driver: bridge
    internal: false

volumes:
  arena-data:
